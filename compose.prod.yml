services:
  server:
    # Pull latest image from GitHub
    image: ghcr.io/queens-rocket-engineering-team/prop-teststand-server:${IMAGE_TAG:-latest}
    network_mode: "host"  # Use host networking for SSDP
    environment:
      - PROP_CONFIG=/app/config.yaml # Default config file location

    # Allow manual interaction with the container (cli)
    stdin_open: true
    tty: true

    volumes:
      - ./config.yaml:/app/config.yaml  # Mount local config file for production
      - ./recordings:/app/recordings # Mount local directory for audio recordings

    # Always restart server on dockerd start
    restart: always

  media:
    image: "bluenviron/mediamtx:latest"
    network_mode: "host"
    ports:
      - "8889:8889"
    depends_on:
      - server
    environment:
    # Use a different RTSP port to avoid conflicts with local testing
    # This port isn't being accessed externally, changing it is fine
      - MTX_RTSPADDRESS=:8558
      - MTX_API=yes

    # Always restart media on dockerd start
    restart: always
    volumes:
      - ./recordings/mediamtx:/recordings

  mumble:
    image: mumblevoip/mumble-server:latest
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    volumes:
      - ./murmur.ini:/etc/mumble/murmur.ini
      - murmur-data:/data

    restart: always

  # Optional view-only GUI for engineers at the pad, reachable at :8080.
  # Serves static files only — it issues no commands and the server is unaware
  # of it. Off unless explicitly enabled:
  #
  #   COMPOSE_PROFILES=gui in .env, or `docker compose --profile gui up -d`
  #
  # GUI_TAG pins which published GUI version is served; leaving it at latest
  # means a redeploy can change what pad tablets load.
  gui:
    profiles: ["gui"]
    image: ghcr.io/queens-rocket-engineering-team/prop-new-control-gui-web:${GUI_TAG:-latest}
    network_mode: "host" # Matches the server service; nginx listens on 8080

    environment:
      # Optional. Unset means the GUI targets whichever host served the page,
      # which is what you want when it runs alongside the server.
      - PROP_SERVER_IP=${PROP_SERVER_IP:-}

    depends_on:
      - server

    restart: always

volumes:
  murmur-data:
